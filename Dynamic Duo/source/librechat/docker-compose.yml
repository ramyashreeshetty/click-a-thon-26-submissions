# The interactive-flow stack (ARCHITECTURE.md): LibreChat + Mongo + the two MCP
# sidecars + a local ClickHouse server. Cloud migration at the end is an env swap:
# point rca-mcp / mcp-clickhouse at the Cloud host and drop the clickhouse service.
#
#   cp .env.example .env        # set OPENAI_API_KEY at minimum
#   docker compose up -d clickhouse            # then load data (see README.md)
#   docker compose up -d                       # the rest
name: rca-librechat

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.5
    # default user: passwordless but loopback-only (clickhouse-users.xml) so the
    # dictionaries' SOURCE(CLICKHOUSE(...)) loopback authenticates; remote access is
    # rca_rw (writer) / librechat_ro (read-only), created by clickhouse-init.sh.
    environment:
      RCA_RW_PASSWORD: ${RCA_RW_PASSWORD:-rca_rw_dev}
      LIBRECHAT_RO_PASSWORD: ${LIBRECHAT_RO_PASSWORD:-librechat_ro}
    ports:
      - "8123:8123"   # HTTP (loader/detector from the host, sidecars in-network)
      - "9000:9000"   # native TCP (clickhouse client from the host)
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse-users.xml:/etc/clickhouse-server/users.d/rca-users.xml:ro
      - ./clickhouse-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 24

  mongodb:
    image: mongo:7
    command: mongod --noauth
    volumes:
      - mongo-data:/data/db

  rca-mcp:
    build:
      context: ..                          # repo root: ships detector/ agent/ rca_mcp/ sql/
      dockerfile: librechat/rca-mcp.Dockerfile
    environment:
      CH_HOST: clickhouse
      CH_TRANSPORT: http
      CH_SECURE: "0"
      CH_HTTP_PORT: "8123"
      CH_USER: rca_rw
      CH_PASSWORD: ${RCA_RW_PASSWORD:-rca_rw_dev}
      RCA_DATASET: ${RCA_DATASET:-main}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_KEY: ${GOOGLE_KEY:-}
      NARRATOR_MODEL: ${NARRATOR_MODEL:-gpt-5-nano}
      NARRATOR_EFFORT: ${NARRATOR_EFFORT:-minimal}   # OpenAI reasoning models only
      # traces flow to ClickStack (default = the in-stack collector; set to "" to disable)
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      # set by librechat/wire_traces.sh after HyperDX registration (team API key)
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
    ports:
      - "8100:8100"   # published for curl-level debugging; LibreChat uses the network
    depends_on:
      clickhouse:
        condition: service_healthy

  mcp-clickhouse:
    build:
      context: .
      dockerfile: mcp-clickhouse.Dockerfile
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_SECURE: "false"
      CLICKHOUSE_USER: librechat_ro
      CLICKHOUSE_PASSWORD: ${LIBRECHAT_RO_PASSWORD:-librechat_ro}
      CLICKHOUSE_DATABASE: rca
      # compose-network-internal + SELECT-only user; for anything shared, switch to
      # CLICKHOUSE_MCP_AUTH_TOKEN and a matching headers: block in librechat.yaml
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"
    ports:
      - "8001:8001"
    depends_on:
      clickhouse:
        condition: service_healthy

  # ── ClickStack: HyperDX UI + OTel collector on the SAME ClickHouse ──────────
  # HyperDX visualizes rca.* (dashboards seeded below) and receives the runner's
  # OTLP spans via otel-collector -> default.otel_traces. Register at :8081 once;
  # hyperdx-seed then provisions the connection + sources + RCA Overview dashboard.
  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:2
    environment:
      MONGO_URI: mongodb://mongodb:27017/hyperdx
      FRONTEND_URL: http://localhost:${HYPERDX_PORT:-8081}
    ports:
      - "${HYPERDX_PORT:-8081}:8080"
    depends_on:
      mongodb:
        condition: service_started
      clickhouse:
        condition: service_healthy

  otel-collector:
    image: docker.hyperdx.io/hyperdx/hyperdx-otel-collector:2
    environment:
      CLICKHOUSE_ENDPOINT: tcp://clickhouse:9000
      CLICKHOUSE_USER: rca_rw
      CLICKHOUSE_PASSWORD: ${RCA_RW_PASSWORD:-rca_rw_dev}
      OPAMP_SERVER_URL: http://hyperdx:4320
      HYPERDX_LOG_LEVEL: error
    # no host ports: rca-mcp reaches it on the compose network (4318 OTLP/HTTP)
    depends_on:
      clickhouse:
        condition: service_healthy
      hyperdx:
        condition: service_started

  hyperdx-seed:
    image: mongo:7
    restart: "no"
    entrypoint: ["mongosh", "--host", "mongodb", "--quiet", "/seed.js"]
    volumes:
      - ./hyperdx-seed.js:/seed.js:ro
    environment:
      HYPERDX_CH_HOST: http://clickhouse:8123
      HYPERDX_CH_USER: rca_rw
      HYPERDX_CH_PASSWORD: ${RCA_RW_PASSWORD:-rca_rw_dev}
    depends_on:
      - mongodb
      - hyperdx

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    env_file: .env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      NODE_ENV: production
    ports:
      - "${LIBRECHAT_PORT:-3080}:3080"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-logs:/app/api/logs
    depends_on:
      - mongodb
      - rca-mcp
      - mcp-clickhouse

volumes:
  clickhouse-data:
  mongo-data:
  librechat-images:
  librechat-logs:
