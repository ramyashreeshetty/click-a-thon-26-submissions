name: librechat

services:
  mcp-clickhouse:
    image: ghcr.io/clickhouse/mcp-clickhouse:0.4.1
    restart: unless-stopped
    environment:
      CLICKHOUSE_HOST: ${CH_HOST:?CH_HOST is required}
      CLICKHOUSE_PORT: ${CH_PORT:-8443}
      CLICKHOUSE_USER: ${MCP_CLICKHOUSE_USER:-agent_ro}
      CLICKHOUSE_PASSWORD: ${MCP_CLICKHOUSE_PASSWORD:?MCP_CLICKHOUSE_PASSWORD is required}
      CLICKHOUSE_DATABASE: ${MCP_CLICKHOUSE_DATABASE:-sonyliv_final}
      CLICKHOUSE_SECURE: "true"
      CLICKHOUSE_VERIFY: "true"
      CLICKHOUSE_CONNECT_TIMEOUT: "10"
      CLICKHOUSE_SEND_RECEIVE_TIMEOUT: "30"
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: "8000"
      CLICKHOUSE_MCP_QUERY_TIMEOUT: "10"
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:?CLICKHOUSE_MCP_AUTH_TOKEN is required}
      CLICKHOUSE_ALLOW_WRITE_ACCESS: "false"
      CLICKHOUSE_ALLOW_DROP: "false"
      CLICKHOUSE_MCP_SERVER_ENABLE_QUERY: "true"
      CLICKHOUSE_MCP_SERVER_ENABLE_INSERT: "false"
      CLICKHOUSE_MCP_SERVER_ENABLE_DROP: "false"
    expose:
      - "8000"
    networks:
      - backend
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 24

  librechat-mongodb:
    image: mongo:4.4.18
    restart: unless-stopped
    command: mongod --noauth
    volumes:
      - librechat-mongodb-data:/data/db
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 24

  librechat-meilisearch:
    image: getmeili/meilisearch:v1.35.1
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?LIBRECHAT_MEILI_MASTER_KEY is required}
    volumes:
      - librechat-meili-data:/meili_data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    restart: unless-stopped
    depends_on:
      librechat-mongodb:
        condition: service_healthy
      librechat-meilisearch:
        condition: service_healthy
      mcp-clickhouse:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: "3080"
      MONGO_URI: mongodb://librechat-mongodb:27017/LibreChat
      MEILI_HOST: http://librechat-meilisearch:7700
      MEILI_MASTER_KEY: ${LIBRECHAT_MEILI_MASTER_KEY:?LIBRECHAT_MEILI_MASTER_KEY is required}
      SEARCH: "true"
      CONFIG_PATH: /app/librechat.yaml
      ALLOW_REGISTRATION: ${LIBRECHAT_ALLOW_REGISTRATION:-false}
      ALLOW_EMAIL_LOGIN: "true"
      ALLOW_SOCIAL_LOGIN: "false"
      ALLOW_SOCIAL_REGISTRATION: "false"
      ALLOW_PASSWORD_RESET: "false"
      ALLOW_ACCOUNT_DELETION: "false"
      SESSION_EXPIRY: ${LIBRECHAT_SESSION_EXPIRY:-1800000}
      REFRESH_TOKEN_EXPIRY: ${LIBRECHAT_REFRESH_TOKEN_EXPIRY:-28800000}
      BAN_VIOLATIONS: "true"
      BAN_DURATION: ${LIBRECHAT_BAN_DURATION:-7200000}
      BAN_INTERVAL: ${LIBRECHAT_BAN_INTERVAL:-10}
      LOGIN_MAX: ${LIBRECHAT_LOGIN_MAX:-7}
      LOGIN_WINDOW: ${LIBRECHAT_LOGIN_WINDOW:-5}
      REGISTER_MAX: ${LIBRECHAT_REGISTER_MAX:-3}
      REGISTER_WINDOW: ${LIBRECHAT_REGISTER_WINDOW:-60}
      LIMIT_CONCURRENT_MESSAGES: "true"
      CONCURRENT_MESSAGE_MAX: ${LIBRECHAT_CONCURRENT_MESSAGE_MAX:-1}
      LIMIT_MESSAGE_IP: "true"
      MESSAGE_IP_MAX: ${LIBRECHAT_MESSAGE_IP_MAX:-30}
      MESSAGE_IP_WINDOW: ${LIBRECHAT_MESSAGE_IP_WINDOW:-10}
      LIMIT_MESSAGE_USER: "true"
      MESSAGE_USER_MAX: ${LIBRECHAT_MESSAGE_USER_MAX:-12}
      MESSAGE_USER_WINDOW: ${LIBRECHAT_MESSAGE_USER_WINDOW:-10}
      NON_BROWSER_VIOLATION_SCORE: ${LIBRECHAT_NON_BROWSER_VIOLATION_SCORE:-20}
      MESSAGE_VIOLATION_SCORE: ${LIBRECHAT_MESSAGE_VIOLATION_SCORE:-2}
      CONCURRENT_VIOLATION_SCORE: ${LIBRECHAT_CONCURRENT_VIOLATION_SCORE:-2}
      OPENAI_KEY: ${LIBRECHAT_OPENAI_KEY:-}
      JWT_SECRET: ${LIBRECHAT_JWT_SECRET:?LIBRECHAT_JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${LIBRECHAT_JWT_REFRESH_SECRET:?LIBRECHAT_JWT_REFRESH_SECRET is required}
      CREDS_KEY: ${LIBRECHAT_CREDS_KEY:?LIBRECHAT_CREDS_KEY is required}
      CREDS_IV: ${LIBRECHAT_CREDS_IV:?LIBRECHAT_CREDS_IV is required}
      CLICKHOUSE_MCP_AUTH_TOKEN: ${CLICKHOUSE_MCP_AUTH_TOKEN:?CLICKHOUSE_MCP_AUTH_TOKEN is required}
      NO_PROXY: localhost,127.0.0.1,::1,mcp-clickhouse,librechat-mongodb,librechat-meilisearch
    expose:
      - "3080"
    volumes:
      - ${LIBRECHAT_CONFIG_PATH:-../../librechat.yaml}:/app/librechat.yaml:ro
      - librechat-images:/app/client/public/images
      - librechat-uploads:/app/uploads
      - librechat-logs:/app/logs
    networks:
      backend: {}
      caddy:
        aliases:
          - librechat
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 30

networks:
  backend: {}
  caddy:
    external: true
    name: ${CADDY_NETWORK:-dashboard_public}

volumes:
  librechat-mongodb-data: {}
  librechat-meili-data: {}
  librechat-images: {}
  librechat-uploads: {}
  librechat-logs: {}
