server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access -- the React app calls relative /api, /investigate,
    # /healthz paths (see src/api/client.ts); this proxy is the production
    # equivalent of vite.config.ts's dev-only proxy, so no app code differs
    # between dev and prod.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /investigate {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /healthz {
        proxy_pass http://api:8000;
    }

    # SPA fallback -- React Router owns /investigations/:id client-side.
    location / {
        try_files $uri /index.html;
    }
}
