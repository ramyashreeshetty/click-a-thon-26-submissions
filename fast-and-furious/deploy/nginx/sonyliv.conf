# nginx front for the demo box.
#
#   sudo cp deploy/nginx/sonyliv.conf /etc/nginx/conf.d/sonyliv.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Two TLS listeners on one certificate:
#
#   :443   LibreChat            127.0.0.1:3080   (docker)
#   :8443  fleet dashboard      127.0.0.1:8081   (sonyliv-mock, systemd)
#
# WHY TWO PORTS RATHER THAN TWO PATHS. LibreChat has no base-path support -- its assets,
# its /api routes and its SSE stream are all absolute from /. Serving it at /chat/ breaks
# it in ways that look like a proxy bug for an hour before you find the cause. So LibreChat
# takes the root of :443 and the dashboard moves to :8443, which costs one security-group
# rule and no application changes at all.
#
# Nothing on this box now binds a public port directly; both upstreams are on loopback and
# nginx is the only TLS terminator. Reverting is two lines in /etc/sonyliv/sonyliv.env plus
# `systemctl restart sonyliv-mock`.

# The self-signed pair the mock used to serve itself. Point these at whatever
# MOCK_TLS_CERT/MOCK_TLS_KEY held in /etc/sonyliv/sonyliv.env; if it had none, generate:
#
#   sudo openssl req -x509 -newkey rsa:2048 -nodes -days 90 \
#     -keyout /etc/sonyliv/tls/server.key -out /etc/sonyliv/tls/server.crt \
#     -subj "/CN=$(curl -s http://169.254.169.254/latest/meta-data/local-hostname)"
#
# Self-signed is adequate here and was already the posture: the token is the
# authentication, TLS is transport encryption, and browsers get one click-through.

# $connection_upgrade is not a built-in. It must be defined at http scope, which is what
# conf.d/*.conf is included into -- a `map` inside a server block is a config error. It
# resolves to "upgrade" for a websocket handshake and "close" otherwise; hardcoding
# `Connection: upgrade` on every request instead breaks keepalive for ordinary ones.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream librechat {
    server 127.0.0.1:3080;
    keepalive 32;
}

upstream sonyliv_mock {
    server 127.0.0.1:8081;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/sonyliv/tls/server.crt;
    ssl_certificate_key /etc/sonyliv/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # File uploads and, more to the point, long agent responses. The default 1m rejects
    # nothing here, but 0 removes a class of surprise from a demo.
    client_max_body_size 25m;

    location / {
        proxy_pass http://librechat;
        proxy_http_version 1.1;

        # LibreChat streams tokens over SSE and uses websockets for the run panel. Without
        # the upgrade headers the UI connects and then silently never updates.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The two that matter for streaming. With buffering on, nginx holds the SSE chunks
        # and the answer arrives in one lump at the end -- indistinguishable from a hang,
        # and the single most common way this deployment looks broken when it is not.
        proxy_buffering off;
        proxy_cache off;

        # A tool loop against a cold ClickHouse service can sit quiet for a while: the MCP
        # server allows 60s per request and LiteLLM 120s. Anything below that turns a slow
        # answer into a 504.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/sonyliv/tls/server.crt;
    ssl_certificate_key /etc/sonyliv/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://sonyliv_mock;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The fleet views poll on a five-second interval and the curve endpoint can run a
        # window-function query over a large fleet. Same reasoning as above.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
