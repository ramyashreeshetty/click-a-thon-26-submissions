[project]
name = "ingester"
version = "0.1.0"
description = "ClickStack-instrumented ClickHouse client: every insert/query is traced and timed."
requires-python = ">=3.11"
dependencies = [
    "clickhouse-connect>=0.7",
    "python-dotenv>=1",
    # Official ClickStack Python SDK (pulls in the OpenTelemetry SDK + OTLP exporters).
    "hyperdx-opentelemetry>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingester"]
