# LibreChat config for the Atlys demo (LibreChat v0.8.x / config 1.3.x).
version: "1.3.13"
cache: true

interface:
  customWelcome: "Atlys agentic analytics — prefer the atlys MCP tools over raw SQL."

# Permit Docker-internal MCP + host Ollama (SSRF exemption).
mcpSettings:
  allowedAddresses:
    - "host.docker.internal:8100"
    - "host.docker.internal:11434"
    - "mcp-clickhouse:8000"

# Chat models. Tool calls always hit host atlys-mcp (Claude Code subscription via
# claude -p) regardless of which of these drives the conversation.
endpoints:
  custom:
    # Ollama Cloud (ollama.com) -- OpenAI-compatible layer at /v1, real API key
    # required (Authorization: Bearer <key>; the local endpoint's literal "ollama"
    # placeholder does NOT work here). Verified directly against the live API:
    #   curl https://ollama.com/v1/chat/completions -H "Authorization: Bearer $OLLAMA_API_KEY" ...
    # `models.default` are real ids read back from GET /v1/models on this account.
    # NOTE: that endpoint returns 200 with NO auth at all (it's a public catalog
    # listing) -- it does not prove a key is valid. Only /v1/chat/completions does.
    - name: "Ollama Cloud"
      apiKey: "${OLLAMA_API_KEY}"
      baseURL: "https://ollama.com/v1/"
      models:
        default:
          - "gpt-oss:20b"
          - "gpt-oss:120b"
          - "glm-5.2"
          - "kimi-k2.6"
          - "deepseek-v4-flash"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama Cloud"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]

    # Local Ollama (gemma4), kept as a fallback that needs no external key/network.
    - name: "Ollama (local)"
      apiKey: "ollama"
      baseURL: "http://host.docker.internal:11434/v1/"
      models:
        default:
          - "gemma4:e4b"
          - "gpt-oss:20b"
          - "qwen3.5:9b"
        fetch: true
      titleConvo: true
      titleModel: "current_model"
      modelDisplayLabel: "Ollama (local)"
      dropParams: ["stop", "user", "frequency_penalty", "presence_penalty"]

mcpServers:
  atlys:
    type: streamable-http
    url: http://host.docker.internal:8100/mcp
    serverInstructions: true
    timeout: 180000
    initTimeout: 60000

  clickhouse:
    type: streamable-http
    url: http://mcp-clickhouse:8000/mcp
    timeout: 60000
    serverInstructions: >
      Read-only exploration only. For any product question about a feature, prefer
      the atlys server's ask() tool: it pushes aggregation into ClickHouse and
      returns interpreted findings. Never SELECT raw event rows into the conversation.
      If explain_metric says a metric is DISPUTED, refuse a single headline number.
