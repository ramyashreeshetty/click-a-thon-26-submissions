# The browser must never see ClickHouse credentials, so /api is proxied to the
# API container rather than called directly. This also keeps the frontend
# origin-clean, so there is no CORS special-casing between dev and the built
# bundle -- the same relative /api paths work in both.
server {
    listen 80;
    server_name _;

    location /api/ {
        # `api` is the compose service name, resolved on the compose network.
        proxy_pass http://api:8787;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Single-page app: unknown paths must fall back to index.html, not 404.
        try_files $uri $uri/ /index.html;
    }
}
