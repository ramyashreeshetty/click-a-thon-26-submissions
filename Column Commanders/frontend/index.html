                        <b>Final narration unavailable:</b> {inc.analysisError}. Available deterministic findings are shown below.
                      </div>
                    )}
                    {w && inc.attribution.verdict === 'LOCALIZED' && (
                      <div className="rootcause">
                        <div className="ic">🎯</div>
                        <div className="rc-body">
                          <div className="rc-k">Root cause</div>
                          <div className="rc-v"><b>{DIM_LABEL[w.dim] || w.dim} = {w.val}</b></div>
                        </div>
                        <div className="rc-stat">
                          <div className="n">{(w.explained * 100).toFixed(0)}%</div>
                          <div className="l">explained</div>
                        </div>
                      </div>
                    )}
                    {inc.attribution?.verdict === 'GLOBAL' && (
                      <div className="rootcause global">
                        <div className="ic">🌐</div>
                        <div className="rc-body">
                          <div className="rc-k">Root cause</div>
                          <div className="rc-v"><b>Global movement</b> — no single segment responsible</div>
                        </div>
                        <div className="rc-stat">
                          <div className="n">{pctDelta(inc.attribution.uniformChange)}</div>
                          <div className="l">uniform change</div>
                        </div>
                      </div>
                    )}
                    {inc.attribution?.verdict === 'UNEXPLAINED' && (
                      <div className="rootcause unexplained">
                        <div className="ic">❓</div>
                        <div className="rc-body">
                          <div className="rc-k">Root cause</div>
                          <div className="rc-v"><b>Unresolved</b>{w ? <> — best candidate {DIM_LABEL[w.dim] || w.dim} = {w.val} falls short</> : ''}</div>
                        </div>
                        {w && <div className="rc-stat">
                          <div className="n">{(w.explained * 100).toFixed(0)}%</div>
                          <div className="l">explained</div>
                        </div>}
                      </div>
                    )}
                    <div className="f-grid">
                      <div className="f-cell"><div className="k">Observed</div>
                        <div className="v" style={{ color: 'var(--danger)' }}>{fmt(inc.worst.v, M.fmt)}</div></div>
                      <div className="f-cell"><div className="k">Expected</div>
                        <div className="v">{fmt(inc.worst.base, M.fmt)}</div></div>
                      <div className="f-cell"><div className="k">Deviation</div>
                        <div className="v">{pctDelta(inc.avgResid)}</div></div>
                      <div className="f-cell"><div className="k">Robust z</div>
                        <div className="v">{inc.peakZ.toFixed(1)}</div></div>
                      {w?.volume != null && <div className="f-cell"><div className="k">Culprit volume</div>
                        <div className="v">{w.volume.toLocaleString()}</div></div>}
                    </div>
                    {inc.attribution?.ranked.length > 0 && (
                      <div style={{ marginTop: 14 }}>
                        <div className="k" style={{
                          fontSize: 10, textTransform: 'uppercase', letterSpacing: '.07em',
                          color: 'var(--faint)', marginBottom: 8, fontWeight: 600
                        }}>
                          {inc.attribution.verdict === 'GLOBAL'
                            ? 'Uniformity evidence · every segment moved by the same amount'
                            : 'Candidate ranking · counterfactual score'}</div>
                        <div className="scroll"><table>
                          <thead><tr><th>Segment</th><th className="num">Baseline</th>
                            <th className="num">Window</th><th className="num">Change</th>
                            <th className="num">Volume</th><th className="num">Explains</th></tr></thead>
                          <tbody>{inc.attribution.ranked.slice(0, 6).map((c, j) => (
                            <tr key={j} style={{ background: (j === 0 && inc.attribution.verdict !== 'GLOBAL') ? 'rgba(244,246,146,.04)' : '' }}>
                              <td>{j === 0 && inc.attribution.verdict !== 'GLOBAL' &&
                                <span className="pill y" style={{ marginRight: 7 }}>TOP</span>}
                                <span style={{ color: 'var(--faint)' }}>{DIM_LABEL[c.dim] || c.dim}</span>{' = '}
                                <b style={{ fontFamily: 'var(--mono)' }}>{c.val}</b></td>
                              <td className="num">{fmt(c.base, M.fmt)}</td>
                              <td className="num" style={{ color: 'var(--danger)' }}>{fmt(c.win, M.fmt)}</td>
                              <td className="num">{pctDelta(c.change)}</td>
                              <td className="num" style={{ color: 'var(--muted)' }}>{c.volume != null ? c.volume.toLocaleString() : '—'}</td>
                              <td className="num"><b>{(c.explained * 100).toFixed(0)}%</b>
                                <div className="bar" style={{ width: Math.min(100, Math.max(0, c.explained * 100)) + '%' }} /></td>
                            </tr>))}</tbody>
                        </table></div>
                      </div>
                    )}
                    {inc.attribution?.verdict !== 'GLOBAL' && inc.attribution?.ruledOut?.length > 0 && (
                      <div style={{ marginTop: 14 }}>
                        <div className="k" style={{
                          fontSize: 10, textTransform: 'uppercase', letterSpacing: '.07em',
                          color: 'var(--faint)', marginBottom: 8, fontWeight: 600
                        }}>
                          Ruled out · checked, not responsible</div>
                        <div className="scroll"><table>
                          <thead><tr><th>Segment</th><th className="num">Baseline</th>
                            <th className="num">Window</th><th className="num">Change</th>
                            <th className="num">Volume</th><th>Why ruled out</th></tr></thead>
                          <tbody>{inc.attribution.ruledOut.map((c, j) => (
                            <tr key={j}>
                              <td><span style={{ color: 'var(--faint)' }}>{DIM_LABEL[c.dim] || c.dim}</span>{' = '}
                                <b style={{ fontFamily: 'var(--mono)' }}>{c.val}</b></td>
                              <td className="num">{fmt(c.base, M.fmt)}</td>
                              <td className="num">{fmt(c.win, M.fmt)}</td>
                              <td className="num">{pctDelta(c.change)}</td>
                              <td className="num" style={{ color: 'var(--muted)' }}>{c.volume.toLocaleString()}</td>
                              <td style={{ color: 'var(--muted)', fontSize: 12 }}>
                                a segment this size ({c.volume.toLocaleString()}) barely moved
                                ({(c.explained * 100).toFixed(0)}% explained) — not the cause</td>
                            </tr>))}</tbody>
                        </table></div>
                        {inc.attribution.skippedDims?.length > 0 && (
                          <div style={{ marginTop: 9, fontSize: 12, color: 'var(--faint)' }}>
                            Also not checked: {inc.attribution.skippedDims.map((s, j) => (
                              <span key={s.dim}>{j > 0 ? ', ' : ''}
                                <b style={{ color: 'var(--muted)' }}>{DIM_LABEL[s.dim] || s.dim}</b>
                                {' '}({s.reason})</span>))}
                          </div>
                        )}
                      </div>
                    )}
                    {inc.id && <TracePanel incidentId={inc.id} />}
                  </div>
                );
              })
          )}

          {result && result.notableDips?.length > 0 && (
            <div className="card" style={{ marginTop: 18 }}>
              <div className="card-hd">
                <span className="card-ttl">Dips checked, not flagged</span>
                <span className="card-sub">visible movement that didn't clear the anomaly bar</span>
              </div>
              <div className="scroll"><table>
                <thead><tr><th>Window</th><th className="num">Observed</th><th className="num">Expected</th>
                  <th className="num">Deviation</th><th className="num">z</th><th>Why not flagged</th></tr></thead>
                <tbody>{result.notableDips.map((d, i) => (
                  <tr key={i}>
                    <td>{d.dir < 0 ? '▼ ' : '▲ '}{d.start}{d.n > 1 ? ` → ${d.end}` : ''}</td>
                    <td className="num">{fmt(d.worst.v, M.fmt)}</td>
                    <td className="num" style={{ color: 'var(--muted)' }}>{fmt(d.worst.base, M.fmt)}</td>
                    <td className="num">{pctDelta(d.avgResid)}</td>
                    <td className="num">{d.peakZ.toFixed(1)}</td>
                    <td style={{ color: 'var(--muted)', fontSize: 12 }}>{d.reasons.join('; ')}</td>
                  </tr>))}</tbody>
              </table></div>
            </div>
          )}
        </div>
      );
    }

    /* ══════════════════════════════════════════════════════════════
       PAGE 2  —  EXPLORE
       ══════════════════════════════════════════════════════════════ */
    function ExplorePage() {
      const [metric, setMetric] = useState('revenue');
      const [groupBy, setGroupBy] = useState('os_version');
      const [interval, setInterval] = useState('daily');
      const [from, setFrom] = useState(DAY_MIN);
      const [to, setTo] = useState(DAY_MAX);
      const [hidden, setHidden] = useState(new Set());
      const [sort, setSort] = useState({ k: 'revenue', dir: -1 });
      const [tick, setTick] = useState(0);
      const [expanded, setExpanded] = useState(false);
      const chartRef = useRef(null);
      const toggleFullscreen = () => setExpanded(e => !e);
      useEffect(() => {
        document.body.classList.toggle('expanded-open', expanded);
        if (!expanded) return;
        const onKey = e => { if (e.key === 'Escape') setExpanded(false); };
        window.addEventListener('keydown', onKey);
        return () => window.removeEventListener('keydown', onKey);
      }, [expanded]);
      useEffect(() => { setHidden(new Set()); setTick(t => t + 1); }, [groupBy, metric, interval, from, to]);

      const M = METRICS[metric];
      const advBlocked = ADV_DIMS.has(groupBy) && (metric === 'fill_rate' || metric === 'requests');
      const values = VALS_BY_DIM[groupBy] || [];

      const series = useMemo(() => values.map((v, i) => ({
        key: v, color: PALETTE[i % PALETTE.length],
        points: buildSeries(groupBy, v, from, to, interval, metric).map(p => ({ ...p, alarm: false }))
      })).filter(s => s.points.length && !hidden.has(s.key)), [groupBy, from, to, interval, metric, hidden, values]);

      const table = useMemo(() => {
        const rows = values.map(v => {
          let a = { reqs: 0, fills: 0, imps: 0, clicks: 0, revenue: 0 };
          for (const r of ROWS) {
            if (r.dim !== groupBy || r.val !== v || r.day < from || r.day > to) continue;
            a.reqs += r.reqs; a.fills += r.fills; a.imps += r.imps; a.clicks += r.clicks; a.revenue += r.revenue;
          }
          return {
            val: v, ...a,
            fill_rate: a.reqs ? a.fills / a.reqs : null, render_rate: a.fills ? a.imps / a.fills : null,
            ctr: a.imps ? a.clicks / a.imps : null, ecpm: a.imps ? a.revenue / a.imps * 1000 : null,
            requests: a.reqs
          };
        }).filter(r => r.reqs > 0);
        return rows.sort((x, y) => ((y[sort.k] ?? -Infinity) - (x[sort.k] ?? -Infinity)) * (sort.dir < 0 ? 1 : -1));
      }, [groupBy, from, to, sort, values]);

      const maxRev = Math.max(...table.map(r => r.revenue), 1);
      const th = (k, l, num = true) => (
        <th className={num ? 'num' : ''} onClick={() => setSort(s => ({ k, dir: s.k === k ? -s.dir : -1 }))}>
          {l}{sort.k === k ? (sort.dir < 0 ? ' ↓' : ' ↑') : ''}</th>);

      return (
        <div className="page">
          <div className="controls">
            <div className="field"><label>Metric</label>
              <select value={metric} onChange={e => setMetric(e.target.value)}>
                {Object.entries(METRICS).map(([k, m]) => <option key={k} value={k}>{m.label}</option>)}
              </select></div>
            <div className="field"><label>Group by</label>
              <select value={groupBy} onChange={e => setGroupBy(e.target.value)}>
                {DIMS.filter(d => d !== '__global__').map(d => <option key={d} value={d}>{DIM_LABEL[d] || d}</option>)}
              </select></div>
            <div className="field"><label>Interval</label>
              <div className="seg">{['daily', 'weekly', 'monthly'].map(i => (
                <button key={i} className={interval === i ? 'on' : ''} onClick={() => setInterval(i)}>
                  {i[0].toUpperCase() + i.slice(1)}</button>))}</div></div>
            <div className="field"><label>Date range</label>
              <DateRange from={from} to={to} onChange={(s, e) => { setFrom(s); setTo(e); }} /></div>
          </div>

          {advBlocked && <div className="note"><b>Note:</b> {M.label} cannot be sliced by {DIM_LABEL[groupBy]} —
            advertiser attributes are absent on unfilled requests. Showing eCPM-safe dimensions only.</div>}

          <div className="grid2">
            <div className={'card' + (expanded ? ' expanded' : '')} ref={chartRef}>
              <div className="card-hd">
                <span className="card-ttl">{M.label} by {DIM_LABEL[groupBy] || groupBy}</span>
                <span className="card-sub">{series.length} series · {interval}</span>
                <div className="spacer" />
                <button className="fs-btn" onClick={toggleFullscreen} title="Fullscreen">⛶</button>
              </div>
              <div className="card-bd">
                <Chart series={series} metric={metric} height={240} animateKey={tick} />
                <div className="legend">
                  {values.map((v, i) => (
                    <div key={v} className={'lg' + (hidden.has(v) ? ' off' : '')}
                      onClick={() => setHidden(h => { const n = new Set(h); n.has(v) ? n.delete(v) : n.add(v); return n; })}>
                      <span className="sw" style={{ background: PALETTE[i % PALETTE.length] }} />{v}
                    </div>))}
                </div>
              </div>
            </div>

            <div className="card">
              <div className="card-hd"><span className="card-ttl">Breakdown</span>
                <span className="card-sub">{from} → {to}</span></div>
              <div className="scroll"><table>
                <thead><tr>{th('val', 'Segment', false)}{th('requests', 'Reqs')}{th('fill_rate', 'Fill')}
                  {th('ecpm', 'eCPM')}{th('revenue', 'Revenue')}</tr></thead>
                <tbody>{table.map(r => (
                  <tr key={r.val}>
                    <td><b>{r.val}</b></td>
                    <td className="num" style={{ color: 'var(--muted)' }}>{(r.requests / 1000).toFixed(0)}k</td>
                    <td className="num">{fmt(r.fill_rate, 'pct')}</td>
                    <td className="num">{fmt(r.ecpm, 'usd')}</td>
                    <td className="num"><b>${r.revenue.toFixed(0)}</b>
                      <div className="bar" style={{ width: (r.revenue / maxRev * 100) + '%' }} /></td>
                  </tr>))}</tbody>
              </table></div>
            </div>
          </div>
        </div>
      );
    }

    /* ══ shell ══ */
    function AllAnomaliesPage() {
      const [sort, setSort] = useState({ k: 'start', dir: -1 });
      const [verdictFilter, setVerdictFilter] = useState('all');

      // Scans every metric, on global (unfiltered) traffic, across the entire dataset —
      // independent of whatever metric/segment/date-range is selected on the Detect page.
      const all = useMemo(() => {
        const out = [];
        Object.keys(METRICS).forEach(metric => {
          const daily = buildSeries('__global__', 'all', DAY_MIN, DAY_MAX, 'daily', metric);
          const detected = detect(daily, 'daily', metric);
          toIncidents(detected).forEach(inc => {
            const bd = new Date(inc.start + 'T00:00:00Z'); bd.setUTCDate(bd.getUTCDate() - 21);
            const be = new Date(inc.start + 'T00:00:00Z'); be.setUTCDate(be.getUTCDate() - 1);
            const attribution = localize(metric, [inc.start, inc.end], [iso(bd), iso(be)], '__global__', 'all');
            out.push({ metric, ...inc, attribution });
          });
        });
        return out;
      }, []);

      const filtered = useMemo(() =>
        verdictFilter === 'all' ? all : all.filter(a => (a.attribution?.verdict || 'UNEXPLAINED') === verdictFilter),
        [all, verdictFilter]);

      const sorted = useMemo(() => {
        const rows = [...filtered];
        rows.sort((x, y) => {
          let xv, yv;
          if (sort.k === 'start') { xv = x.start; yv = y.start; }
          else if (sort.k === 'metric') { xv = METRICS[x.metric].label; yv = METRICS[y.metric].label; }
          else if (sort.k === 'deviation') { xv = Math.abs(x.avgResid); yv = Math.abs(y.avgResid); }
          else if (sort.k === 'z') { xv = x.peakZ; yv = y.peakZ; }
          else if (sort.k === 'explained') { xv = x.attribution?.winner?.explained ?? -1; yv = y.attribution?.winner?.explained ?? -1; }
          else { xv = x.start; yv = y.start; }
          if (xv < yv) return -1 * sort.dir; if (xv > yv) return 1 * sort.dir; return 0;
        });
        return rows;
      }, [filtered, sort]);

      const th = (k, l) => (
        <th onClick={() => setSort(s => ({ k, dir: s.k === k ? -s.dir : 1 }))} style={{ cursor: 'pointer' }}>
          {l}{sort.k === k ? (sort.dir > 0 ? ' ↑' : ' ↓') : ''}</th>);

      const counts = useMemo(() => {
        const c = { LOCALIZED: 0, GLOBAL: 0, UNEXPLAINED: 0 };
        all.forEach(a => { const v = a.attribution?.verdict || 'UNEXPLAINED'; c[v] = (c[v] || 0) + 1; });
        return c;
      }, [all]);

      return (
        <div className="page">
          <div className="kpis" style={{ marginBottom: 18 }}>
            <div className="kpi"><div className="k">Total anomalies</div>
              <div className="v">{all.length}</div>
              <div className="d">across all {Object.keys(METRICS).length} metrics · {DAY_MIN} → {DAY_MAX}</div></div>
            <div className="kpi"><div className="k">Localized</div>
              <div className="v" style={{ color: 'var(--ok)' }}>{counts.LOCALIZED || 0}</div>
              <div className="d">root cause identified</div></div>
            <div className="kpi"><div className="k">Global</div>
              <div className="v" style={{ color: 'var(--warn)' }}>{counts.GLOBAL || 0}</div>
              <div className="d">no single segment</div></div>
            <div className="kpi"><div className="k">Unexplained</div>
              <div className="v" style={{ color: 'var(--danger)' }}>{counts.UNEXPLAINED || 0}</div>
              <div className="d">below explain threshold</div></div>
          </div>

          <div className="controls" style={{ marginBottom: 18 }}>
            <div className="field"><label>Verdict</label>
              <div className="seg">
                {['all', 'LOCALIZED', 'GLOBAL', 'UNEXPLAINED'].map(v => (
                  <button key={v} className={verdictFilter === v ? 'on' : ''} onClick={() => setVerdictFilter(v)}>
                    {v === 'all' ? 'All' : v[0] + v.slice(1).toLowerCase()}</button>))}
              </div></div>
            <div className="spacer" />
            <span className="card-sub">{sorted.length} of {all.length} shown</span>
          </div>

          <div className="card">
            <div className="card-hd">
              <span className="card-ttl">All detected anomalies</span>
              <span className="card-sub">every metric, global traffic, full date range — independent of any single filter</span>
            </div>
            <div className="scroll">
              {sorted.length === 0 ? (
                <div className="empty"><div className="ic">✓</div>
                  <div style={{ color: 'var(--ok)', fontWeight: 600 }}>No anomalies match this filter</div></div>
              ) : (
                <table>
                  <thead><tr>
                    {th('metric', 'Metric')}<th>Direction</th>{th('start', 'Window')}
                    <th className="num">Observed</th><th className="num">Expected</th>
                    {th('deviation', 'Deviation')}{th('z', 'Robust z')}<th>Verdict</th>
                    <th>Root cause</th>{th('explained', 'Explained')}
                  </tr></thead>
                  <tbody>{sorted.map((inc, i) => {
                    const M = METRICS[inc.metric];
                    const w = inc.attribution?.winner;
                    const verdict = inc.attribution?.verdict || 'UNEXPLAINED';
                    return (
                      <tr key={i}>
                        <td><b>{M.label}</b></td>
                        <td>{inc.dir < 0 ? '▼ Drop' : '▲ Spike'}</td>
                        <td style={{ color: 'var(--muted)' }}>{inc.start}{inc.n > 1 ? ` → ${inc.end}` : ''}</td>
                        <td className="num" style={{ color: 'var(--danger)' }}>{fmt(inc.worst.v, M.fmt)}</td>
                        <td className="num">{fmt(inc.worst.base, M.fmt)}</td>
                        <td className="num">{pctDelta(inc.avgResid)}</td>
                        <td className="num">{inc.peakZ.toFixed(1)}</td>
                        <td><span className={'pill ' + (verdict === 'LOCALIZED' ? 'g' : verdict === 'GLOBAL' ? 'y' : 'n')}>{verdict}</span></td>
                        <td>{verdict === 'LOCALIZED' && w ? <><span style={{ color: 'var(--faint)' }}>{DIM_LABEL[w.dim] || w.dim}</span>{' = '}<b style={{ fontFamily: 'var(--mono)' }}>{w.val}</b></>
                          : verdict === 'GLOBAL' ? <span style={{ color: 'var(--muted)' }}>uniform, no single segment</span>
                            : w ? <><span style={{ color: 'var(--faint)' }}>{DIM_LABEL[w.dim] || w.dim}</span>{' = '}<span style={{ fontFamily: 'var(--mono)' }}>{w.val}</span> (weak)</>
                              : <span style={{ color: 'var(--faint)' }}>—</span>}</td>
                        <td className="num">{w ? (w.explained * 100).toFixed(0) + '%' : '—'}</td>
                      </tr>
                    );
                  })}</tbody>
                </table>
              )}
            </div>
          </div>
        </div>
      );
    }

    function App() {
      const [page, setPage] = useState('detect');
      return (
        <>
          <div className="topbar">
            <div className="brand"><div className="logo">CH</div>Root-Cause Analyst</div>
            <div className="tabs">
              <button className={'tab' + (page === 'detect' ? ' on' : '')} onClick={() => setPage('detect')}>Detect</button>
              <button className={'tab' + (page === 'explore' ? ' on' : '')} onClick={() => setPage('explore')}>Explore</button>
              <button className={'tab' + (page === 'all' ? ' on' : '')} onClick={() => setPage('all')}>All Anomalies</button>
            </div>
            <div className="spacer" />
            <span style={{
              fontFamily: 'var(--mono)', fontSize: 11, fontWeight: 700, letterSpacing: '.06em',
              padding: '3px 9px', borderRadius: 5,
              background: DETECTION_MODE === 'v2' ? 'rgba(142,230,172,.13)' : 'rgba(244,246,146,.11)',
              color: DETECTION_MODE === 'v2' ? 'var(--ok)' : 'var(--ch-yellow-dim)',
              border: `1px solid ${DETECTION_MODE === 'v2' ? 'rgba(142,230,172,.25)' : 'rgba(244,246,146,.2)'}`,
            }}>
              {DETECTION_MODE === 'v2' ? 'V2 · API' : 'V1 · API'}
            </span>
            <div className="status"><span className="dot" />{ROWS.length.toLocaleString()} rollup rows · {DAY_MIN} → {DAY_MAX}</div>
          </div>
          {page === 'detect' ? <DetectPage /> : page === 'explore' ? <ExplorePage /> : <AllAnomaliesPage />}
        </>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
