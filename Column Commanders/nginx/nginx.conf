server {
    listen 80;
    server_name _;

    # ── Root ──────────────────────────────────────────────────────────────────
    location = / {
        return 302 /dashboard/;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    # Serves the static SPA files from the mounted frontend directory.
    # alias maps /dashboard/ → /usr/share/nginx/html/ so relative script
    # references inside index.html (api.js, config.js) resolve correctly.
    location /dashboard/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # ── Backend API ───────────────────────────────────────────────────────────
    # Proxy to the Go service without stripping the /api prefix — the backend
    # already owns /api/v1/* and /api/v2/* so no rewrite is needed.
    location /api {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Health check and data-ingestion endpoints
    location ~ ^/(health|insert|batch|upload) {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30m;
        client_max_body_size 500M;
    }

    # ── OTel collector (browser traces) ───────────────────────────────────────
    # The browser-side HyperDX SDK sends OTLP traces/logs to /otel/v1/*.
    # Trailing slash in both location and proxy_pass strips the /otel prefix
    # so the collector sees the standard /v1/traces and /v1/logs paths.
    location /otel/ {
        proxy_pass         http://otel-collector:4318/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        # Pass CORS preflight headers through — the collector handles CORS itself.
        proxy_pass_request_headers on;
    }
}
