# Please consult our docs for more info: https://www.librechat.ai/docs/configuration/docker_override

# TO USE THIS FILE, FIRST UNCOMMENT THE LINE ('services:')

# THEN UNCOMMENT ONLY THE SECTION OR SECTIONS CONTAINING THE CHANGES YOU WANT TO APPLY
# SAVE THIS FILE AS 'docker-compose.override.yaml'
# AND USE THE 'docker compose build' & 'docker compose up -d' COMMANDS AS YOU WOULD NORMALLY DO

# WARNING: YOU CAN ONLY SPECIFY EVERY SERVICE NAME ONCE (api, mongodb, meilisearch, ...)
# IF YOU WANT TO OVERRIDE MULTIPLE SETTINGS IN ONE SERVICE YOU WILL HAVE TO EDIT ACCORDINGLY

# EXAMPLE: if you want to use the config file and the latest numbered release docker image the result will be:

# services:
#   api:
#     volumes:
#     - type: bind
#       source: ./librechat.yaml
#       target: /app/librechat.yaml
#     image: registry.librechat.ai/danny-avila/librechat:latest

# ---------------------------------------------------

services:

  # USE LIBRECHAT CONFIG FILE
  api:
    # environment:
    #   - MONGO_URI=${MONGO_URI}
    volumes:
      - type: bind
        source: ./librechat.yaml
        target: /app/librechat.yaml
      - ./context_docs:/app/context_docs
      - ./specs:/app/specs

  # WRITE-CAPABLE ClickHouse MCP (open-source mcp-clickhouse).
  # The hosted mcp.clickhouse.cloud is READ-ONLY, so the Instrumentation Agent's
  # DDL/INSERT go through this self-hosted server instead. Referenced by
  # librechat.yaml -> mcpServers.clickhouse_write_tools at http://clickhouse-mcp-write:8000/mcp
  clickhouse-mcp-write:
    image: ghcr.io/clickhouse/mcp-clickhouse:latest
    container_name: clickhouse-mcp-write
    restart: unless-stopped
    environment:
      # --- Cloud connection (HTTPS interface on 8443, NOT native 9440) ---
      CLICKHOUSE_HOST: ${CH_HOST}
      CLICKHOUSE_PORT: 8443
      CLICKHOUSE_USER: ${CH_USER}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD}
      CLICKHOUSE_SECURE: "true"
      # The container image lacks a CA bundle that trusts the Cloud cert chain
      # (same reason the standalone CLI needs --accept-invalid-certificate), so
      # disable cert verification for this trusted Cloud endpoint.
      CLICKHOUSE_VERIFY: "false"
      CLICKHOUSE_DATABASE: ${CH_DATABASE:-atlys}
      # --- Enable write/DDL tools (run_query executes CREATE/ALTER/INSERT) ---
      CLICKHOUSE_ALLOW_WRITE_ACCESS: "true"
      CLICKHOUSE_ALLOW_DROP: "true"
      # --- Serve over HTTP so LibreChat can reach it via streamable-http ---
      CLICKHOUSE_MCP_SERVER_TRANSPORT: http
      CLICKHOUSE_MCP_BIND_HOST: 0.0.0.0
      CLICKHOUSE_MCP_BIND_PORT: 8000
      # HTTP transport mandates auth config. Server is only on the internal docker
      # network (port not published), so auth is disabled to match the no-header
      # librechat.yaml client config.
      CLICKHOUSE_MCP_AUTH_DISABLED: "true"

  # GIT-WRITE MCP (custom, ./git-mcp). Lets the Instrumentation Agent commit a generated
  # schema file and push it DIRECTLY to the target branch (master) with no shell — the
  # LibreChat agent has no local shell and execute_code runs in a remote sandbox with no
  # repo access. Authenticates to GitHub with a PAT ($GITHUB_TOKEN). Referenced by
  # librechat.yaml -> mcpServers.clickhouse_git_write at http://clickhouse-git-write:8000/mcp
  clickhouse-git-write:
    build:
      context: ./git-mcp
    image: atlys-git-mcp:latest
    container_name: clickhouse-git-write
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      CH_TARGET_REPO: ${CH_TARGET_REPO:-https://github.com/srinidhi-22/tillthelastrow.git}
      CH_TARGET_BRANCH: ${CH_TARGET_BRANCH:-master}
      CH_REPO_DIR: /work/repo
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Atlys Instrumentation Agent}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-atlys-agent@users.noreply.github.com}
      MCP_BIND_HOST: 0.0.0.0
      MCP_BIND_PORT: 8000

