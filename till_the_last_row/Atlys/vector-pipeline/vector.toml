type = "http"
inputs = ["remap_destination_card_clicked"]
uri = "https://lyab2g0slj.eastus2.azure.clickhouse.cloud:8443/?database=atlys&user=default&password=IAe_cPA4PukDz&query=INSERT%20INTO%20destination_card_clicked%20FORMAT%20JSONEachRow"
method = "post"
[sinks.sink_destination_card_clicked.encoding]
codec = "json"
[sinks.sink_destination_card_clicked.framing]
method = "newline_delimited"
[sinks.sink_destination_card_clicked.tls]
