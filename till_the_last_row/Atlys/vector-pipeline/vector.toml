# =============================================================================
# OBSERVABILITY — Vector internal pipeline logs -> OTel collector -> otel_logs
# =============================================================================

[sources.internal_pipeline_logs]
  type = "internal_logs"

[transforms.enrich_pipeline_logs]
  type        = "remap"
  inputs      = ["internal_pipeline_logs"]
  drop_on_error = true
  source      = '''
    log_level      = string(.metadata.level) ?? "INFO"
    component_id   = string(.metadata.component_id) ?? ""
    component_type = string(.metadata.component_type) ?? ""
    component_kind = string(.metadata.component_kind) ?? ""
    msg            = string(.message) ?? ""
    ts_nanos       = to_string(to_int(to_unix_timestamp(now(), unit: "nanoseconds")))

    . = {
      "resourceLogs": [{
        "resource": {
          "attributes": [
            {"key": "service.name", "value": {"stringValue": "atlys-vector-pipeline"}},
            {"key": "pipeline",     "value": {"stringValue": "parquet-to-clickhouse"}},
            {"key": "environment",  "value": {"stringValue": "local"}}
          ]
        },
        "scopeLogs": [{
          "scope": {"name": "vector.internal"},
          "logRecords": [{
            "timeUnixNano": ts_nanos,
            "severityText": log_level,
            "body": {"stringValue": msg},
            "attributes": [
              {"key": "component_id",   "value": {"stringValue": component_id}},
              {"key": "component_type", "value": {"stringValue": component_type}},
              {"key": "component_kind", "value": {"stringValue": component_kind}}
            ]
          }]
        }]
      }]
    }
  '''

[sinks.otlp_pipeline_logs]
  type    = "http"
  inputs  = ["enrich_pipeline_logs"]
  uri     = "http://atlys-otelcol:4318/v1/logs"
  method  = "post"

  [sinks.otlp_pipeline_logs.encoding]
    codec = "json"

  [sinks.otlp_pipeline_logs.batch]
    max_events = 1

  [sinks.otlp_pipeline_logs.framing]
    method = "bytes"

  [sinks.otlp_pipeline_logs.request]
    headers = { "Content-Type" = "application/json" }
    retry_attempts = 3
