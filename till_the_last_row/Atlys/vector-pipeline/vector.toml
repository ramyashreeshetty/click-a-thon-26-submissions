# vector.toml — Direct Parquet → ClickHouse Cloud pipeline
# No OTel involved. 8 exec sources → 8 remap transforms → 8 HTTP sinks.
# mode = "scheduled" (runs once on start, then every 24h)

# ---------------------------------------------------------------------------
# SOURCES — one exec per parquet file
# ---------------------------------------------------------------------------

[sources.src_destination_card_clicked]
type = "exec"
mode = "scheduled"
scheduled.exec_interval_secs = 86400
command = ["python3", "/app/parquet_reader.py"]
environment = { PARQUET_FILE = "/app/data/destination_card_clicked.parquet", EVENT_NAME = "destination_card_clicked" }

