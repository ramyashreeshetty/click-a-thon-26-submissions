# ---------------------------------------------------------------------------
# TRANSFORMS — parse the NDJSON line, skip non-JSON lines gracefully
# The Python script emits: {"payload": {...}}
# We extract .payload so the sink sends {"payload": {...}} per row.
# ---------------------------------------------------------------------------

[transforms.remap_destination_card_clicked]
type = "remap"
inputs = ["src_destination_card_clicked"]
drop_on_error = true
source = '''
  parsed, err = parse_json(.message)
  if err != null {
    abort
  }
  .payload = parsed.payload
  del(.message)
  del(.source_type)
  del(.timestamp)
  del(.host)
'''

