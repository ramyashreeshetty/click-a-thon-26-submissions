# ============================================================
# OTel Collector — HyperDX ClickHouse-integrated config
# Receives OTLP from emit.py, writes to ClickHouse Cloud via
# HyperDX schema (otel_logs, otel_traces, etc.)
# ============================================================

receivers:
  fluentforward:
    endpoint: "0.0.0.0:24224"
  otlp/hyperdx:
    protocols:
      grpc:
        include_metadata: true
        endpoint: '0.0.0.0:4317'
      http:
        cors:
          allowed_origins: ['*']
          allowed_headers: ['*']
        include_metadata: true
        endpoint: '0.0.0.0:4318'

processors:
  batch:
  memory_limiter:
    limit_mib: 1500
    spike_limit_mib: 512
    check_interval: 5s

connectors:
  routing/logs:
    default_pipelines: [logs/out-default]
    error_mode: ignore
    table:
      -
        statement: route() where IsMatch(attributes["rr-web.event"], ".*")
        pipelines: [logs/out-rrweb]

exporters:
  debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 200

  clickhouse/rrweb:
    database: ${env:CH_DATABASE}
    endpoint: clickhouse://lyab2g0slj.eastus2.azure.clickhouse.cloud:9440?secure=true&skip_verify=true
    password: ${env:CH_PASSWORD}
    username: ${env:CH_USER}
    ttl: 720h
    logs_table_name: hyperdx_sessions
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  clickhouse:
    database: ${env:CH_DATABASE}
    endpoint: clickhouse://lyab2g0slj.eastus2.azure.clickhouse.cloud:9440?secure=true&skip_verify=true
    password: ${env:CH_PASSWORD}
    username: ${env:CH_USER}
    ttl: 720h
    timeout: 5s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

service:
  pipelines:
    traces:
      receivers: [otlp/hyperdx]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, debug]

    metrics:
      receivers: [otlp/hyperdx]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, debug]

    logs/in:
      receivers: [otlp/hyperdx]
      exporters: [routing/logs]

    logs/out-default:
      receivers: [routing/logs]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, debug]

    logs/out-rrweb:
      receivers: [routing/logs]
      processors: [memory_limiter, batch]
      exporters: [clickhouse/rrweb, debug]

    # Vector pipeline logs → otel_logs
    logs/vector:
      receivers: [fluentforward]
      processors: [memory_limiter, batch]
      exporters: [clickhouse, debug]
